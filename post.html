---
layout: default
---
<section class="page-top">
  <div class="wrap">
    <article class="post">
      <h1>{{ page.title }}</h1>
      <span class="date">{{ page.date | date: "%B %-d, %Y" }}</span>
      {{ content }}
      <a class="back" href="/blog/">&larr; All posts</a>
    </article>
  </div>
</section>
